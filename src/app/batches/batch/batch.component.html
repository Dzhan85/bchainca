<div class="well">
  <dl class="horizontal">
    <dt>Signer Public Key</dt>
    <dd>{{ data.header?.signer_public_key }}</dd>

    <dt *ngIf="data.state">State</dt>
    <dd>{{ data.state }}</dd>
  </dl>
</div>

<hr/>

<ng-container *ngIf="!showDataAsJSON">
  <data-table [data]="data.transactions" [type]="'Transactions'"></data-table>
</ng-container>

<ng-container *ngIf="showDataAsJSON">
  <h4 class="h4">Payload</h4>
  <pre class="code-viewer">{{ jsonData }}</pre>
</ng-container>
